services:
  - type: web
    name: wecom-function-lab
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: WECOM_TOKEN
        sync: false
      - key: WECOM_ENCODING_AES_KEY
        sync: false
      - key: WECOM_CORP_ID
        sync: false
