<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>企微侧边栏 AI 助手 Demo（纯前端）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei"; height: 100vh; display: flex; background: #f5f5f5; }
  .chat { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #ddd; background: #f0f0f0; }
  .chat-header { height: 48px; background: #1aad19; color: #fff; display: flex; align-items: center; padding: 0 16px; font-weight: 600; }
  .chat-body { flex: 1; padding: 16px; overflow-y: auto; }
  .msg { max-width: 70%; margin-bottom: 12px; padding: 10px 14px; border-radius: 8px; line-height: 1.4; }
  .msg.customer { background: #fff; align-self: flex-start; }
  .msg.staff { background: #95ec69; align-self: flex-end; margin-left: auto; }
  .sidebar { width: 320px; display: flex; flex-direction: column; background: #fff; }
  .sidebar-header { height: 48px; background: #1890ff; color: #fff; display: flex; align-items: center; padding: 0 16px; font-weight: 600; }
  .sidebar-body { flex: 1; padding: 16px; overflow-y: auto; }
  .client-switch { display: flex; gap: 8px; margin-bottom: 16px; }
  .client-btn { flex: 1; padding: 6px; border: 1px solid #d9d9d9; background: #fff; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .client-btn.active { background: #e6f7ff; border-color: #1890ff; color: #1890ff; }
  .card { background: #fafafa; border: 1px solid #eee; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
  .card-title { font-weight: 600; margin-bottom: 6px; color: #333; }
  .btn { padding: 8px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 13px; }
  .btn-primary { background: #1890ff; color: #fff; }
  .btn-default { background: #f5f5f5; border: 1px solid #d9d9d9; }
  .suggestion { background: #e6f7ff; border-left: 3px solid #1890ff; padding: 10px; margin-bottom: 8px; border-radius: 4px; font-size: 13px; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; padding: 8px 16px; border-radius: 4px; font-size: 13px; opacity: 0; transition: opacity .3s; }
  .toast.show { opacity: 1; }
  .mock-voice { font-style: italic; color: #999; background: #fafafa; padding: 8px; border-radius: 4px; margin-bottom: 8px; }
  .thinking { color: #999; font-style: italic; }
</style>
</head>
<body>

<div class="chat">
  <div class="chat-header">💬 与客户聊天</div>
  <div class="chat-body" id="chatBody">
    <div class="msg customer">你好，我想咨询一下你们这款理财产品的起购金额是多少？</div>
    <div class="msg staff">您好，这款产品起购金额是 1 万元。</div>
    <div class="msg customer">那预期收益率大概多少呀？</div>
    <div class="mock-voice">🎤 [语音消息 3″]</div>
  </div>
</div>

<div class="sidebar">
  <div class="sidebar-header">🤖 AI 助手（侧边栏）</div>
  <div class="sidebar-body">
    <div class="client-switch">
      <button class="client-btn active" onclick="switchClient('C001')">客户 A</button>
      <button class="client-btn" onclick="switchClient('C002')">客户 B</button>
      <button class="client-btn" onclick="switchClient('C003')">客户 C</button>
    </div>

    <div class="card">
      <div class="card-title">客户信息（Mock）</div>
      <div>ID: <b id="clientId">C001</b></div>
      <div>标签：高净值、稳健型</div>
    </div>

    <button class="btn btn-primary" style="width:100%" onclick="generateSuggestions()">✨ 生成 AI 回复建议</button>

    <div id="suggestions" style="margin-top:16px"></div>

    <button class="btn btn-default" style="width:100%;margin-top:16px" onclick="addCustomerMsg()">+ 模拟客户追问</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentClient = 'C001';

function switchClient(id) {
  currentClient = id;
  document.getElementById('clientId').innerText = id;
  document.querySelectorAll('.client-btn').forEach(btn => {
    btn.classList.toggle('active', btn.innerText.includes(id));
  });
  document.getElementById('suggestions').innerHTML = '';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('已复制到剪贴板，请 Ctrl+V 发送'));
}

function generateSuggestions() {
  const box = document.getElementById('suggestions');
  box.innerHTML = '<div class="thinking">AI 正在分析上下文...</div>';

  // ✅ 这里将来替换为真实 fetch('/api/ai-suggest')
  setTimeout(() => {
    box.innerHTML = `
      <div class="card-title">AI 建议话术</div>
      <div class="suggestion" id="s1">
        该产品近一年年化收益率约 3.8%，属于中低风险，比较适合您目前的资产配置需求。
        <div class="actions">
          <button class="btn btn-default" onclick="copyText(document.getElementById('s1').firstChild.textContent.trim())">复制</button>
        </div>
      </div>
      <div class="suggestion" id="s2">
        如果您更关注流动性，也可以看看我们的“日日盈”系列，起购 1 万，随存随取。
        <div class="actions">
          <button class="btn btn-default" onclick="copyText(document.getElementById('s2').firstChild.textContent.trim())">复制</button>
        </div>
      </div>
    `;
  }, 1200);
}

function addCustomerMsg() {
  const chat = document.getElementById('chatBody');
  const msgs = [
    '如果我一次性投 50 万，有什么额外优惠吗？',
    '这个产品赎回一般多久到账？',
    '有没有类似但收益更高的产品？'
  ];
  const text = msgs[Math.floor(Math.random() * msgs.length)];
  const div = document.createElement('div');
  div.className = 'msg customer';
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  document.getElementById('suggestions').innerHTML = '';
}
</script>
</body>
</html>
